<nav class="rail">
  @for (n of nav; track n.path) {
    <a
      class="rail-item"
      [routerLink]="n.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: n.path === '/' }"
    >
      <app-icon [name]="n.icon" />
      <span>{{ n.label }}</span>
    </a>
  }
</nav>

<main class="content">
  <router-outlet />
</main>

@if (showAdd() && !quickAdd.request() && !dialogs.state()) {
  <button type="button" class="fab" aria-label="Add event" (click)="quickAdd.open()">+</button>
}

<app-dialog />

<app-toasts />

@if (quickAdd.request(); as r) {
  <app-quick-add [request]="r" />
}
